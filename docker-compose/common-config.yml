services:
  network-deploy-service:   #mostly used by rabbitmq
    networks:
      - eazybank

  microservice-base-config:  #mostly used by other services
    extends:
      service: network-deploy-service
    deploy:
      resources:
        limits:
          memory: 700m

  microservice-configserver-config:  #kept for reference — no longer extended by any service; depends_on + env now declared explicitly in docker-compose.yml
    extends:
      service: microservice-base-config
    depends_on:
      configserver:
        condition: service_healthy  #this tell account service that start when healthy not when started
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/